<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; media-src file:; base-uri 'none'; form-action 'none'">
<title>Video</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{color-scheme:light;--bg:#f6f7fb;--bar:#fff;--text:#334155;--border:rgba(99,102,241,.2);--hover:#e0e7ff}
:root[data-theme=dark]{color-scheme:dark;--bg:#080b1a;--bar:#0b0f2e;--text:#cbd5e1;--border:rgba(99,102,241,.3);--hover:#24294d}
body{height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font-family:sans-serif}
header{height:36px;min-height:36px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 6px 0 12px;background:var(--bar);border-bottom:1px solid var(--border);-webkit-app-region:drag;user-select:none}
.title{display:flex;align-items:center;gap:8px;min-width:0;font-size:12px}
.title svg{flex-shrink:0;color:#8b5cf6}
#filename{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.controls{display:flex;gap:4px;flex-shrink:0;-webkit-app-region:no-drag}
button{width:30px;height:26px;border:0;border-radius:6px;background:transparent;color:var(--text);cursor:pointer;font-size:16px}
button:hover{background:var(--hover)}button:focus-visible{outline:2px solid #818cf8;outline-offset:1px}#close:hover{background:rgba(239,68,68,.15);color:#f87171}
main{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:16px}
video{display:block;width:100%;height:100%;min-height:0;object-fit:contain;border-radius:6px}
#error{position:absolute;inset:0;align-items:center;justify-content:center;padding:20px;font-size:13px;background:var(--bg)}
#error:not([hidden]){display:flex}
</style><script src="./video-viewer.js" defer></script></head>
<body>
<header><div class="title"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="5" width="13" height="14" rx="2"/><path d="m16 10 5-3v10l-5-3"/></svg><span id="filename"></span></div>
<div class="controls"><button id="minimize">−</button><button id="maximize">□</button><button id="close">✕</button></div></header>
<main><video id="player" controls autoplay playsinline></video><p id="error" role="alert" hidden></p></main>
</body></html>
