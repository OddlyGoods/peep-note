name: Build and release Open PeepNote

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            command: build:linux
          - os: windows-2022
            platform: win
            command: build:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate release version
        run: node scripts/verify-release.cjs version
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
      - run: npm run test:updates
      - name: Test local data and source privacy
        if: matrix.platform == 'linux'
        run: |
          npm run test:features
          npm run test:local
          npm run typecheck
          npm run test:privacy
      - name: Build installer and update metadata
        run: npm run ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify installer checksums and metadata
        run: node scripts/verify-release.cjs ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: peepnote-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            release/*.deb
            release/*.exe
            release/*.blockmap
            release/latest*.yml

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: peepnote-*
          merge-multiple: true
          path: release
      - name: Verify complete release
        run: |
          node scripts/verify-release.cjs version
          node scripts/verify-release.cjs linux
          node scripts/verify-release.cjs win
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Publish complete release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft > release-status.json; then
            node -e "if (!require('./release-status.json').isDraft) throw Error('Refusing to replace an already published release')"
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Open PeepNote $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release/*.deb release/*.exe release/*.blockmap release/latest*.yml --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
