<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; cursor: crosshair; user-select: none; touch-action: none; }
    canvas { display: block; position: fixed; top: 0; left: 0; }
    #hint {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10,12,40,0.85);
      color: #a5b4fc;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-family: 'Segoe UI', sans-serif;
      border: 1px solid rgba(99,102,241,0.3);
      pointer-events: none;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 12px;
      white-space: nowrap;
    }
    #change-monitor {
      pointer-events: auto;
      cursor: pointer;
      border: 1px solid rgba(165,180,252,0.45);
      border-radius: 12px;
      background: rgba(99,102,241,0.2);
      color: #e0e7ff;
      padding: 4px 10px;
      font: inherit;
    }
    #change-monitor:hover, #change-monitor:focus-visible {
      background: rgba(99,102,241,0.45);
      outline: 2px solid #a5b4fc;
      outline-offset: 2px;
    }
    #size-badge {
      position: fixed;
      background: rgba(99,102,241,0.9);
      color: white;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-family: monospace;
      pointer-events: none;
      z-index: 10;
      display: none;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hint"><span id="hint-text">Drag to select an area · Esc to cancel</span><button id="change-monitor" type="button">Change monitor</button></div>
  <div id="size-badge"></div>
  <script src="./lasso.js"></script>
  <script>
    const canvas = document.getElementById('c')
    const ctx = canvas.getContext('2d')
    const badge = document.getElementById('size-badge')
    let img = null
    let pendingImage = null
    let recordingRegionMode = false
    let lassoMode = false
    let points = []
    let pointerId = null
    let renderFrame = 0
    const lasso = window.PeepNoteLasso
    let dragging = false
    let sx = 0, sy = 0, ex = 0, ey = 0
    let language = 'en'
    const messages = {
      en: { screenshot: 'Drag to select an area · Esc to cancel', recording: 'Drag to select a recording area · Esc to cancel', monitor: 'Change monitor', lasso: 'Draw around an area · Release to capture · Esc to cancel', retry: 'Draw a larger closed area · Esc to cancel' },
      ko: { screenshot: '드래그하여 영역 선택 · Esc 취소', recording: '드래그하여 녹화 영역 선택 · Esc 취소', monitor: '모니터 변경', lasso: '드래그로 영역 그리기 · 놓으면 캡처 · Esc 취소', retry: '더 넓은 영역을 그려 주세요 · Esc 취소' },
      ja: { screenshot: 'ドラッグして範囲を選択 · Escでキャンセル', recording: 'ドラッグして録画範囲を選択 · Escでキャンセル', monitor: 'モニターを変更', lasso: 'ドラッグで囲む · 離してキャプチャ · Escでキャンセル', retry: 'もっと広い範囲を囲んでください · Escでキャンセル' },
      zh: { screenshot: '拖动选择区域 · Esc 取消', recording: '拖动选择录制区域 · Esc 取消', monitor: '切换显示器', lasso: '拖动绘制边界 · 松开截图 · Esc 取消', retry: '请绘制更大的区域 · Esc 取消' }
    }

    function applyLanguage(value) {
      language = Object.prototype.hasOwnProperty.call(messages, value) ? value : 'en'
      const copy = messages[language]
      document.documentElement.lang = language
      document.getElementById('hint-text').textContent = recordingRegionMode ? copy.recording : lassoMode ? copy.lasso : copy.screenshot
      document.getElementById('change-monitor').textContent = copy.monitor
    }

    window.electronAPI.on('language-changed', applyLanguage)

    window.electronAPI.on('snipping-init', (payload) => {
      const dataUrl = typeof payload === 'string' ? payload : payload.dataUrl
      img = null
      ctx.clearRect(0, 0, canvas.width, canvas.height)
      resetDrag()
      lassoMode = typeof payload === 'object' && payload?.mode === 'lasso'
      recordingRegionMode = typeof payload === 'object' && payload?.mode === 'recording-region'
      applyLanguage(typeof payload === 'object' && payload?.language ? payload.language : language)
      const image = new Image()
      pendingImage = image
      image.onload = () => {
        if (pendingImage !== image) return
        img = image
        canvas.width = payload?.width || window.innerWidth
        canvas.height = payload?.height || window.innerHeight
        canvas.style.width = canvas.width + 'px'
        canvas.style.height = canvas.height + 'px'
        draw()
      }
      image.onerror = () => { if (pendingImage === image) window.electronAPI.snippingCancel() }
      image.src = dataUrl
    })

    document.getElementById('change-monitor').addEventListener('click', () => {
      resetDrag()
      draw()
      window.electronAPI.changeSnippingMonitor()
    })

    function draw() {
      if (!img) return
      ctx.clearRect(0, 0, canvas.width, canvas.height)
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height)

      // dim overlay
      ctx.fillStyle = 'rgba(0,0,0,0.5)'
      ctx.fillRect(0, 0, canvas.width, canvas.height)

      if (dragging && lassoMode) {
        ctx.save()
        lasso.trace(ctx, points)
        ctx.clip('evenodd')
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height)
        ctx.restore()
        lasso.trace(ctx, points)
        ctx.strokeStyle = '#a78bfa'
        ctx.lineWidth = 2
        ctx.setLineDash([6, 4])
        ctx.stroke()
        ctx.setLineDash([])
        const xs = points.map(point => point.x), ys = points.map(point => point.y)
        badge.style.display = 'block'
        badge.textContent = `${Math.round(Math.max(...xs) - Math.min(...xs))} × ${Math.round(Math.max(...ys) - Math.min(...ys))}`
        badge.style.left = Math.max(0, Math.min(canvas.width - 110, ex + 12)) + 'px'
        badge.style.top = Math.max(0, Math.min(canvas.height - 30, ey + 12)) + 'px'
      } else if (dragging) {
        const x = Math.min(sx, ex), y = Math.min(sy, ey)
        const w = Math.abs(ex - sx), h = Math.abs(ey - sy)

        // restore selection area
        ctx.save()
        ctx.globalCompositeOperation = 'destination-out'
        ctx.fillRect(x, y, w, h)
        ctx.restore()
        if (w > 0 && h > 0) ctx.drawImage(img, x, y, w, h, x, y, w, h)

        // border
        ctx.strokeStyle = '#6366f1'
        ctx.lineWidth = 1.5
        ctx.strokeRect(x, y, w, h)

        // corner handles
        const hs = 6
        ctx.fillStyle = '#6366f1'
        ;[[x,y],[x+w,y],[x,y+h],[x+w,y+h]].forEach(([cx,cy]) => {
          ctx.fillRect(cx - hs/2, cy - hs/2, hs, hs)
        })

        // size badge
        badge.style.display = 'block'
        badge.textContent = `${w} × ${h}`
        badge.style.left = (x + w/2 - 30) + 'px'
        badge.style.top = (y > 24 ? y - 24 : y + h + 4) + 'px'
      } else {
        badge.style.display = 'none'
      }
    }

    function resetDrag() {
      dragging = false
      if (pointerId !== null && canvas.hasPointerCapture(pointerId)) canvas.releasePointerCapture(pointerId)
      pointerId = null
      points = []
      badge.style.display = 'none'
    }

    function pointAt(event) {
      const bounds = canvas.getBoundingClientRect()
      return { x: Math.max(0, Math.min(canvas.width, (event.clientX - bounds.left) * canvas.width / bounds.width)),
        y: Math.max(0, Math.min(canvas.height, (event.clientY - bounds.top) * canvas.height / bounds.height)) }
    }

    function appendPoint(point) {
      ex = point.x; ey = point.y
      const last = points[points.length - 1]
      if (!last || Math.hypot(point.x - last.x, point.y - last.y) >= 1) points.push(point)
      // Bound the live path without losing its endpoints on very long drags.
      if (points.length > 8192) points = points.filter((_, index) => index % 2 === 0 || index === points.length - 1)
    }

    function scheduleDraw() {
      if (renderFrame) return
      renderFrame = requestAnimationFrame(() => { renderFrame = 0; draw() })
    }

    canvas.addEventListener('pointerdown', event => {
      if (!img || event.button !== 0 || dragging) return
      event.preventDefault()
      applyLanguage(language)
      dragging = true
      pointerId = event.pointerId
      canvas.setPointerCapture(pointerId)
      const point = pointAt(event)
      sx = ex = point.x; sy = ey = point.y
      points = [point]
      scheduleDraw()
    })

    canvas.addEventListener('pointermove', event => {
      if (!dragging || event.pointerId !== pointerId) return
      appendPoint(pointAt(event))
      scheduleDraw()
    })

    canvas.addEventListener('pointerup', event => {
      if (!dragging || event.pointerId !== pointerId) return
      appendPoint(pointAt(event))
      const selectedPoints = points
      resetDrag()
      if (lassoMode) {
        const output = lasso.crop(img, selectedPoints, canvas.width, canvas.height)
        if (!output) {
          draw()
          document.getElementById('hint-text').textContent = messages[language].retry
          return
        }
        window.electronAPI.snippingDone(output.toDataURL('image/png'))
        return
      }
      const x = Math.min(sx, ex), y = Math.min(sy, ey)
      const w = Math.abs(ex - sx), h = Math.abs(ey - sy)
      if (w < 5 || h < 5) { window.electronAPI.snippingCancel(); return }

      if (recordingRegionMode) {
        window.electronAPI.recordingRegionDone({ x, y, width: w, height: h, canvasWidth: canvas.width, canvasHeight: canvas.height })
        return
      }

      const off = document.createElement('canvas')
      off.width = w; off.height = h
      off.getContext('2d').drawImage(img, x, y, w, h, 0, 0, w, h)
      window.electronAPI.snippingDone(off.toDataURL('image/png'))
    })

    canvas.addEventListener('pointercancel', () => { resetDrag(); draw() })
    canvas.addEventListener('contextmenu', event => event.preventDefault())

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') window.electronAPI.snippingCancel()
    })
  </script>
</body>
</html>
